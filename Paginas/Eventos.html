    const grid = document.getElementById('eventsGrid');
    const tpl = document.getElementById('eventCardTpl');
    const searchEl = document.getElementById('eventsSearch');
    const statusEl = document.getElementById('eventsStatus');

    function statusClass(s) {
      return s === 'OK' ? 'status--ok' : 'status--review';
    }

    function getEventArt(e) {
      const name = (e.name || '').toLowerCase();
      const detail = (e.detail || '').toLowerCase();
      const text = `${name} ${detail}`;

      const hasAny = (arr) => arr.some(w => text.includes(w));

      // Días de la semana => chronos + star (fallback a muerte/círculo por clases actuales)
      if (hasAny(['lunes', 'martes', 'miercoles', 'miércoles', 'jueves', 'viernes', 'sabado', 'sábado', 'domingo'])) {
        return { art: 'tcg-art--death', glyph: 'art-glyph--circle' };
      }

      // Combate / sacrificar / fusión / mutación => phoenix/death + triangle (fallback círculo/triángulo no existe => diamond)
      if (hasAny(['sacrificio', 'ataque', 'kamikaze', 'fusión', 'fusion', 'mutación', 'mutacion'])) {
        return { art: 'tcg-art--phoenix', glyph: 'art-glyph--diamond' };
      }

      // Apoyo => owl/steel
      if (hasAny(['entrenamiento', 'refuerzos', 'retiro'])) {
        return { art: 'tcg-art--owl', glyph: 'art-glyph--owl' };
      }

      // Elementales/lluvia/tormenta => abyssal/ ring
      if (hasAny(['lluvia', 'tormenta', 'helada'])) {
        return { art: 'tcg-art--abyssal', glyph: 'art-glyph--ring' };
      }

      // Default
      return { art: 'tcg-art--cosmic', glyph: 'art-glyph--circle' };
    }

    function parseSemicolonCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (!inQuotes && c === ';') {
          row.push(field);
          field = '';
          continue;
        }

        if (!inQuotes && (c === '\n' || c === '\r')) {
          if (c === '\r' && next === '\n') i++;
          if (field.length || row.length) {
            row.push(field);
            rows.push(row);
          }
          row = [];
          field = '';
          continue;
        }

        field += c;
      }

      if (field.length || row.length) {
        row.push(field);
        rows.push(row);
      }

      return rows.filter(r => r.some(x => (x ?? '').toString().trim() !== ''));
    }

    async function loadEventos() {
      try {
        const res = await fetch('../Context/Ekko - Base de datos - Eventos.csv');
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const text = await res.text();
        const rows = parseSemicolonCSV(text.replace(/^\uFEFF/, ''));

        const header = rows[0].map(h => (h || '').toString().trim());
        const body = rows.slice(1);

        const iCodigo = header.findIndex(h => h.toLowerCase() === 'codigo');
        const iNombre = header.findIndex(h => h.toLowerCase() === 'nombre');
        const iDetalle = header.findIndex(h => h.toLowerCase() === 'detalle');
        const iEstado = header.findIndex(h => h.toLowerCase() === 'estado');

        return body.map(cols => {
          const get = (i) => (i >= 0 ? (cols[i] ?? '') : '');
          const id = get(iCodigo);
          return {
            id,
            name: get(iNombre),
            detail: get(iDetalle),
            status: get(iEstado),
            extra: ''
          };
        }).filter(e => e.id && e.name);
      } catch (err) {
        console.warn('No se pudo cargar el CSV de eventos dinámicamente (por ejemplo, por restricciones de CORS de tu navegador al abrir el archivo localmente con double click). Cargando los datos de respaldo locales...', err);
        return FALLBACK_EVENTOS;
      }
    }

    let events = [];

    function render() {
      const q = (searchEl.value || '').trim().toLowerCase();
      const st = statusEl.value;

      const filtered = events.filter(e => {
        const matchQ = !q || [e.name, e.id, e.detail, e.extra].join(' ').toLowerCase().includes(q);

        const matchS = st === 'ALL' || e.status === st;
        return matchQ && matchS;
      });

      grid.innerHTML = '';

      if (!filtered.length) {
        const p = document.createElement('p');
        p.className = 'empty-state';
        p.textContent = 'No hay eventos para mostrar con esos filtros.';
        grid.appendChild(p);
        return;
      }

      filtered.forEach(e => {
        const node = tpl.content.cloneNode(true);
        node.querySelector('.mechanic-id').textContent = e.id;
        node.querySelector('.mechanic-name').textContent = e.name;
        node.querySelector('.mechanic-detail').textContent = e.detail;
        node.querySelector('.mechanic-extra').textContent = e.extra || 'Sin detalle adicional.';

        const statusBadge = node.querySelector('[data-status-text]');
        statusBadge.textContent = e.status;
        statusBadge.classList.remove('status--ok', 'status--review', 'status--muted');
        statusBadge.classList.add(statusClass(e.status));

        const art = getEventArt(e);
        const artContainer = node.querySelector('[data-art-container]');
        const glyphEl = node.querySelector('[data-art-glyph]');
        if (artContainer && glyphEl) {
          artContainer.classList.remove(
            'tcg-art--death',
            'tcg-art--phoenix',
            'tcg-art--owl',
            'tcg-art--nature',
            'tcg-art--steel',
            'tcg-art--abyssal',
            'tcg-art--cosmic'
          );
          artContainer.classList.add(art.art);

          glyphEl.classList.remove(
            'art-glyph--death',
            'art-glyph--phoenix',
            'art-glyph--owl',
            'art-glyph--circle',
            'art-glyph--diamond',
            'art-glyph--hexagon',
            'art-glyph--ring'
          );
          glyphEl.classList.add(art.glyph);
        }

        grid.appendChild(node);
      });
    }

    searchEl.addEventListener('input', render);
    statusEl.addEventListener('change', render);

    loadEventos()
      .then(list => {
        events = list;
        render();
      })
      .catch(err => {
        console.error(err);
        grid.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'empty-state';
        p.textContent = 'Error cargando eventos.';
        grid.appendChild(p);
      });
